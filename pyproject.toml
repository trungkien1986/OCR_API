[tool.ruff]
line-length = 110
target-version = "py311"
# design/plans/memory là tài liệu Markdown chứa đoạn code minh hoạ, không phải source
# thật — ruff format hỗ trợ reformat code block trong .md nên phải loại trừ tường minh,
# nếu không sẽ đè format lên nội dung tài liệu.
extend-exclude = ["db/migrations/versions", "design", "plans", "memory"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's DI pattern (Depends()/File()/Form() as argument defaults) là idiom
# chuẩn của framework, không phải lỗi mutable-default thật — ignore rule này là thực
# hành phổ biến cho codebase FastAPI.
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
exclude = ["db/migrations/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Bắt buộc phải khai báo tường minh — lệnh CI gọi thẳng `pytest -q` (không phải
# `python -m pytest`), nên KHÔNG tự thêm thư mục gốc project vào sys.path, làm
# `from api.config import settings` trong conftest.py lỗi ModuleNotFoundError.
pythonpath = ["."]
