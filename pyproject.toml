[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
exclude = ["db/migrations/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
